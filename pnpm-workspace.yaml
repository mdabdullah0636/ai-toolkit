packages:
  # Domain-based organization (AI Development Toolkit architecture)
  # Foundation layer (L0) - types, runtime, provider, capabilities
  - 'packages/foundation/*'
  # AI Core (L1) - main SDK
  - 'packages/ai/*'
  # Gateway (L3) - routing and orchestration
  - 'packages/gateway/*'
  # Providers (L1.5) - AI provider implementations
  - 'packages/providers/*'
  # Protocol (L2) - Model Context Protocol
  - 'packages/mcp/*'
  # Integration (L5) - framework and ecosystem adapters
  - 'packages/integrations/*'
  # Experience/Tooling (L6) - UI and developer tools
  - 'packages/ui/*'
  - 'packages/tooling/*'
  # Infrastructure - internal test utilities
  - 'packages/testing/*'

  # Platform layers (implemented waves)
  - 'packages/agents/*' # Wave 2 (Month 5-6) - Agent Platform
  - 'packages/workflow/*' # Wave 3 (Month 7-8) - Workflow Engine
  - 'packages/memory/*' # Wave 1 (Month 4-5) - Memory System
  - 'packages/context/*' # Wave 1 (Month 4) - Context Management
  - 'packages/evals/*' # Wave 4 (Month 9-10) - Evaluation Engine
  - 'packages/observability/*' # Wave 4 (Month 10-11) - Observability
  - 'packages/security/*' # Wave 4 (Month 11-12) - Security Layer
  - 'packages/sandbox/*' # Wave 3 (Month 8) - Sandbox Runtime
  - 'packages/retrieval/*' # Wave 3 (Month 8-9) - Retrieval Layer
  - 'packages/tools/*' # Wave 2 (Month 6) - Tool Platform

  # Other workspaces
  - 'tools/*'
  # Application workspaces (single package hosting the docs/www/studio sites)
  - 'apps'
  # Examples are organized into categorized subdirectories (01-foundations, 02-framework-integration, 03-integrations, 04-tools)
  - 'examples/*/*'
